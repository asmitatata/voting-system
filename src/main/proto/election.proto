syntax = "proto3";


option java_multiple_files = true;
option java_package = "com.hamropatro";
option java_outer_classname = "ElectionServiceProto";
option objc_class_prefix = "ESP";
import "common.proto";
package com.hamropatro;

service ElectionService {
  rpc CreateElection(CreateElectionRequest)returns (Response){}

  rpc GetElectionByElectionId(ElectionIdRequest) returns (GetElectionResponse) {}

  rpc GetAllElections(Empty) returns (GetAllElectionResponse) {}

  rpc UpdateElection(UpdateElectionRequest)returns (Response){}

}

message CreateElectionRequest{
  string election_name = 1;
  string voting_type = 2;
  int32 max_votes = 3;
  int64 start_at = 4;
  int64 end_at = 5;
  bool isActive = 6;
  string start_time = 7;
  string end_time = 8;
}

message ElectionIdRequest {
  string election_id = 1;
}

message GetElectionResponse {
  string election_id = 1;
  string election_name = 2;
  repeated Candidates candidate = 3;
  string voting_type = 4;
  int32 max_votes = 5;
  int64 start_at = 6;
  int64 end_at = 7;
  bool isActive = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  string start_time = 11;
  string end_time = 12;
}

message GetAllElectionResponse{
  repeated Elections elections = 1;
}

message UpdateElectionRequest{
  string election_id = 1;
  string election_name = 2;
  int64 start_at = 5;
  int64 end_at = 6;
  bool isActive = 7;
  string start_time = 8;
  string end_time = 9;
}

message ElectionExistsResponse{
  bool exists = 1;
}