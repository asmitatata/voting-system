syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.hamropatro";
option java_outer_classname = "VotingService";
option objc_class_prefix = "VS";
import "common.proto";

package com.hamropatro;

service VotingSystemService {
  rpc castVote (CastVoteRequest) returns (Response) {}
  rpc updateVote (UpdateVoteRequest) returns (Response) {}
  rpc hasVoted (VoteExistsRequest) returns (VoteExistsResponse) {}
  rpc getVotesByElectionId (VotesByElectionIdRequest) returns (getVotesByElectionIdResponse) {}
  rpc votesCountByElectionId (VotesByElectionIdRequest) returns (VoteCountResponse) {}
  rpc votesCountByCandidateId (VotesByCandidateIdRequest) returns (VoteCountResponse) {}

}

message CastVoteRequest {
  string election_id = 1;
  string user_id = 2;
  string candidate_id = 3;
  int32 vote_count=4;
}

message UpdateVoteRequest {
  string vote_id = 1;
  string election_id = 2;
  string user_id = 3;
  string candidate_id = 4;
  int32 vote_count=5;
}

message VoteExistsRequest{
 string election_id = 1;
 string user_id = 2;
}

message VoteExistsResponse{
  bool exists = 1;
}

message getVotesByElectionIdResponse{
repeated VotesByElectionId votes=1;
}

message VotesByElectionIdRequest{
  string election_id = 2;
}

message getAllVotes{
  repeated Votes votes = 1;
}

message VoteCountResponse{
  int64 count =1;
}

message VotesByCandidateIdRequest{
  string candidate_id = 1;
}